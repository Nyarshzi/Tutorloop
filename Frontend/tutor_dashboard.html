<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Dashboard | TutorLoop</title>

    <link rel="stylesheet" href="css/tutor_dashboard.css">
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
     <aside class="sidebar" id="sidebar">
        <div class="logo">
            <img src="images/Tutorloop_logo.png" alt="logo">
            <span>TUTORLOOP</span>
        </div>

        <nav>
            <a class="active">Dashboard</a>
            <a>Session Requests</a>
            <a>My Schedule</a>
            <a>My Students</a>
            <a>Profile</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <button class="menu-btn" id="menuBtn">☰</button>

            <h1 id="greeting">
                Good Evening 🌙, Tutor 👩‍🏫
            </h1>

            <button class="logout">Logout</button>
        </header>

        <!-- CARDS -->
        <section class="cards">
            <div class="card">
                <h2>0</h2>
                <p>Session Requests</p>
            </div>
            <div class="card">
                <h2>0</h2>
                <p>My Schedule</p>
            </div>
            <div class="card">
                <h2>0</h2>
                <p>Students</p>
            </div>
            <div class="card">
                <h2>0</h2>
                <p>Completed</p>
            </div>
        </section>

        <!-- BOTTOM -->
        <section class="bottom">
            <div class="box">
                <h3>Recent Requests</h3>
                <p>No requests yet</p>
            </div>

            <div class="box">
                <h3>Upcoming Sessions</h3>
                <p>No sessions scheduled</p>
            </div>
        </section>

    </main>

</div>

<script src="js/tutor_dashboard.js"></script>

</body>
</html>
