<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Tutor Profile</title>

    
    <link rel="stylesheet" href="css/create_tutor_profile.css">
</head>
<body>

<div class="container">
    
    <div class="header">
        <h2>Create Tutor Profile</h2>
    </div>

    <div class="form-card">

        
        <div class="form-container">

            <form method="POST">

                
                <div class="form-group">
                    <label>Bio / Description</label>
                    <textarea name="bio" required></textarea>
                </div>

                
                <div class="form-group">
                    <label>Tutoring Rate (₱/hour)</label>
                    <input type="number" name="rate" required>
                </div>

               
                <div class="form-group">
                    <label>Subjects</label>
                    <input type="text" name="subjects" placeholder="Example: Math, Programming">
                </div>

                
                <div class="form-group">
                    <label>Availability Schedule</label>
                    <input type="text" name="availability" placeholder="Example: Mon-Fri 6PM-9PM">
                </div>

               
                <button type="submit" class="submit-btn">Create Profile</button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
