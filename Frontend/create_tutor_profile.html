<!DOCTYPE html>
<html>
<head>
<title>Create Tutor Profile</title>
</head>
<body>

<h2>Create Tutor Profile</h2>


<form method="POST">
    <label>Bio / Description:</label><br>
    <textarea name="bio" required></textarea><br><br>

    <label>Tutoring Rate:</label><br>
    <input type="number" name="rate" required><br><br>

    <label>Subjects:</label><br>
    <input type="text" name="subjects" placeholder="Example: Math, Programming"><br><br>

    <label>Availability Schedule:</label><br>
    <input type="text" name="availability" placeholder="Example: Mon-Fri 6PM-9PM"><br><br>

    <button type="submit">Create Profile</button>
</form>

</body>
</html>
