<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutee Dashboard | TutorLoop</title>

    <link rel="stylesheet" href="css/tutee_dashboard.css">
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <span>TUTORLOOP</span>
            <img src="images/Tutorloop_logo.png" alt="logo">
        </div>

        <nav>
            <a class="active">Dashboard</a>
            <a>Sessions</a>
            <a>Messages</a>
            <a>Profile</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <!-- MENU BUTTON (FIXED) -->
            <button class="menu-btn" id="menuBtn">☰</button>

            <h1>Good Evening 🌙 Tutee</h1>

            <button class="logout">Logout</button>
        </header>

        <!-- CARDS -->
        <section class="cards">
            <div class="card">
                <h2>0</h2>
                <p>Completed</p>
            </div>
            <div class="card">
                <h2>0</h2>
                <p>Requests</p>
            </div>
            <div class="card">
                <h2>0</h2>
                <p>Subjects</p>
            </div>
            <div class="card">
                <h2>0</h2>
                <p>Upcoming</p>
            </div>
        </section>

        <!-- FIND -->
        <section class="find">
            <h2>Find a Tutor</h2>
            <input type="text" placeholder="Search subject...">
            <button>Search</button>
        </section>

        <!-- BOTTOM -->
        <section class="bottom">
            <div class="box">
                <h3>My Requests</h3>
                <p>No requests yet</p>
            </div>

            <div class="box">
                <h3>Upcoming</h3>
                <p>No sessions yet</p>
            </div>
        </section>

    </main>

</div>

<script src="js/tutee_dashboard.js"></script>

</body>
</html>
