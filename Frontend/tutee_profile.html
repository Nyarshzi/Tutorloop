<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | TutorLoop</title>

    <link rel="stylesheet" href="css/tutee_dashboard.css">
    <link rel="stylesheet" href="css/tutee_profile.css">
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <span>TUTORLOOP</span>
            <img src="images/Tutorloop_logo.png" alt="logo">
        </div>

        <nav>
            <a href="tutee_dashboard.html">Dashboard</a>
            <a href="tutee_sessions.html">Sessions</a>
            <a href="tutee_messages.html">Messages</a>
            <a class="active">Profile</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h1>My Profile</h1>
            <button class="logout">Logout</button>
        </header>

        <!-- PROFILE CONTENT -->
        <section class="profile">

            <!-- PROFILE CARD -->
            <div class="profile-card">

                <div class="profile-header">
                    <img src="images/default_profile.png" alt="profile">
                    <h2>Lara Jane</h2>
                    <p>Tutee</p>
                </div>

                <div class="profile-info">
                    <p><strong>Email:</strong> Larajane@email.com</p>
                    <p><strong>Contact:</strong> 09123456789</p>
                    <p><strong>School:</strong> ISAT U</p>
                </div>

                <button class="edit-btn">Edit Profile</button>

            </div>

        </section>

    </main>

</div>

<script src="js/tutee_dashboard.js"></script>

</body>
</html>
